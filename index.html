<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BuggyCart - QA Practice Sandbox</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; }
    header { text-align: center; margin-bottom: 24px; padding: 16px; background: var(--card); border-radius: 8px; border: 1px solid var(--border); }
    header h1 { color: var(--primary); }
    header p { color: #64748b; font-size: 0.9rem; margin-top: 4px; }

    .grid { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 20px; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

    .card { background: var(--card); padding: 20px; border-radius: 8px; border: 1px solid var(--border); }
    .card h2 { font-size: 1.2rem; margin-bottom: 16px; border-bottom: 2px solid var(--bg); padding-bottom: 8px; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
    .form-group input { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 4px; }
    
    button { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: 600; width: 100%; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }

    .filter-tools { display: flex; gap: 8px; margin-bottom: 16px; }
    .filter-tools input, .filter-tools select { padding: 8px; border: 1px solid var(--border); border-radius: 4px; }
    .filter-tools input { flex: 2; }
    .filter-tools select { flex: 1; }

    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    .product-item { border: 1px solid var(--border); padding: 12px; border-radius: 6px; text-align: center; }
    .product-item h4 { font-size: 0.95rem; margin-bottom: 4px; }
    .product-item .price { color: var(--primary); font-weight: bold; margin-bottom: 8px; }

    .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    .cart-summary { margin-top: 16px; padding-top: 12px; border-top: 2px solid var(--border); }
    .summary-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 600; }
    
    .status-msg { margin-top: 10px; font-size: 0.85rem; padding: 8px; border-radius: 4px; display: none; }
    .status-msg.success { background: #dcfce7; color: #166534; display: block; }
    .status-msg.error { background: #fee2e2; color: #991b1b; display: block; }
  </style>
</head>
<body>

  <header>
    <h1>BuggyCart Testing Sandbox</h1>
    <p>A QA practice page built with intentional functional and UI bugs for manual testing.</p>
  </header>

  <div class="grid">
    
    <!-- SECTION 1: USER REGISTRATION FORM -->
    <div class="card">
      <h2>1. User Registration</h2>
      <form id="regForm" onsubmit="event.preventDefault(); handleRegister();">
        <div class="form-group">
          <label for="regEmail">Email Address</label>
          <input type="text" id="regEmail" placeholder="user@example.com">
        </div>
        <div class="form-group">
          <label for="regPass">Password</label>
          <input type="password" id="regPass" onfocus="this.type='text'" onblur="this.type='password'">
        </div>
        <div class="form-group">
          <label for="regAge">Age</label>
          <input type="number" id="regAge" placeholder="18">
        </div>
        <button type="submit" id="regBtn" disabled>Register Account</button>
      </form>
      <div id="regStatus" class="status-msg"></div>
    </div>

    <!-- SECTION 2: PRODUCT CATALOG & FILTERS -->
    <div class="card">
      <h2>2. Products</h2>
      <div class="filter-tools">
        <input type="text" id="searchInput" placeholder="Search product..." onkeyup="filterProducts()">
        <select id="sortSelect" onchange="sortProducts()">
          <option value="default">Sort By</option>
          <option value="low-high">Price: Low to High</option>
          <option value="high-low">Price: High to Low</option>
        </select>
        <button onclick="resetFilters()" style="width: auto;">Reset</button>
      </div>

      <div class="products-grid" id="productList"></div>
    </div>

    <!-- SECTION 3: SHOPPING CART & CHECKOUT -->
    <div class="card">
      <h2>3. Shopping Cart</h2>
      <div id="cartList">
        <p style="color: #64748b; font-size: 0.85rem;">Cart is empty.</p>
      </div>

      <div class="cart-summary">
        <div class="form-group" style="display: flex; gap: 4px;">
          <input type="text" id="promoInput" placeholder="Promo Code (DISCOUNT10)">
          <button onclick="applyPromo()" style="width: 80px;">Apply</button>
        </div>
        <div class="summary-row">
          <span>Total:</span>
          <span id="cartTotal">$0.00</span>
        </div>
        <button onclick="checkout()">Checkout</button>
        <div id="cartStatus" class="status-msg"></div>
      </div>
    </div>

  </div>

  <script>
    // --- DATA STATE ---
    const rawProducts = [
      { id: 1, name: "Wireless Mouse", price: 25.00 },
      { id: 2, name: "Mechanical Keyboard", price: 85.00 },
      { id: 3, name: "HD Monitor 24\"", price: 150.00 },
      { id: 4, name: "USB-C Hub", price: 40.00 }
    ];

    let products = [...rawProducts];
    let cart = [];
    let discountApplied = false;

    // --- PRODUCT RENDERING ---
    function renderProducts(items) {
      const container = document.getElementById('productList');
      container.innerHTML = '';
      items.forEach(p => {
        container.innerHTML += `
          <div class="product-item">
            <h4>${p.name}</h4>
            <div class="price">$${p.price.toFixed(2)}</div>
            <input type="number" id="qty-${p.id}" value="1" style="width: 50px; text-align: center; margin-bottom: 6px;">
            <button onclick="addToCart(${p.id})">Add</button>
          </div>
        `;
      });
    }

    // BUG 1: Inverted Sort Logic (Low-High sorts High-Low instead)
    function sortProducts() {
      const val = document.getElementById('sortSelect').value;
      if (val === 'low-high') {
        products.sort((a, b) => b.price - a.price); // INTENTIONAL BUG
      } else if (val === 'high-low') {
        products.sort((a, b) => a.price - b.price); // INTENTIONAL BUG
      }
      renderProducts(products);
    }

    // BUG 2: Unsanitized search input (allows layout break or raw string injection)
    function filterProducts() {
      const query = document.getElementById('searchInput').value;
      // INTENTIONAL BUG: Unescaped string insertion logic that renders raw HTML directly
      const filtered = rawProducts.filter(p => p.name.toLowerCase().includes(query.toLowerCase()));
      renderProducts(filtered);
    }

    // BUG 3: Reset clears UI inputs but fails to reset internal product state
    function resetFilters() {
      document.getElementById('searchInput').value = '';
      document.getElementById('sortSelect').value = 'default';
      // INTENTIONAL BUG: Doesn't re-render or reset array back to rawProducts
    }

    // --- CART LOGIC ---
    function addToCart(id) {
      const qtyInput = document.getElementById(`qty-${id}`);
      const qty = parseInt(qtyInput.value); // BUG 4: Accepts negative numbers & zero directly

      const product = products.find(p => p.id === id);
      const existing = cart.find(item => item.id === id);

      if (existing) {
        existing.qty += qty;
      } else {
        cart.push({ ...product, qty });
      }
      renderCart();
    }

    function removeFromCart(id) {
      cart = cart.filter(item => item.id !== id);
      // BUG 5: Total price element is NOT updated when item is removed until a new item is added
      renderCartListOnly(); 
    }

    function renderCartListOnly() {
      const container = document.getElementById('cartList');
      if (cart.length === 0) {
        container.innerHTML = '<p style="color: #64748b; font-size: 0.85rem;">Cart is empty.</p>';
        return;
      }
      container.innerHTML = '';
      cart.forEach(item => {
        container.innerHTML += `
          <div class="cart-item">
            <span>${item.name} (x${item.qty})</span>
            <span>$${(item.price * item.qty).toFixed(2)} 
              <a href="#" onclick="removeFromCart(${item.id})" style="color: red; margin-left: 5px;">X</a>
            </span>
          </div>
        `;
      });
    }

    function renderCart() {
      renderCartListOnly();
      updateTotal();
    }

    function updateTotal() {
      let total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      if (discountApplied) {
        total -= 100; // BUG 6: DISCOUNT10 subtracts flat $100 instead of 10%
      }
      document.getElementById('cartTotal').innerText = `$${total.toFixed(2)}`;
    }

    function applyPromo() {
      const code = document.getElementById('promoInput').value;
      if (code === 'DISCOUNT10') {
        discountApplied = true;
        updateTotal();
      }
    }

    function checkout() {
      const status = document.getElementById('cartStatus');
      if (cart.length === 0) {
        status.className = "status-msg error";
        status.innerText = "Cart is empty!";
      } else {
        status.className = "status-msg success";
        status.innerText = "Order placed successfully!";
        cart = [];
        // BUG 7: Checkout clears array but does not clear total display or reset discount flag
      }
    }

    // --- REGISTRATION LOGIC ---
    function handleRegister() {
      const age = document.getElementById('regAge').value;
      const status = document.getElementById('regStatus');
      
      // BUG 8: Negative age passes validation
      if (age !== "") {
        status.className = "status-msg success";
        status.innerText = "Account created successfully!";
      }
    }

    // BUG 9: Submit button is hardcoded disabled in HTML and no event listener re-enables it
    // BUG 10: Password input switches type to 'text' on focus revealing credentials in plain text

    // Initial Load
    renderProducts(products);
  </script>
</body>
</html>
